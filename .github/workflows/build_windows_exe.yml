# This is a basic workflow to help you get started with Actions

name: Build Executable

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # Build natively so the workflow does not depend on Wine inside Docker.
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pcpp==1.30 ply==3.11 pyinstaller==6.4.0

      - name: Package BARScriptCompiler for Windows
        run: python -m PyInstaller --clean --noconfirm BARScriptCompiler.spec

      - name: Smoke test executable
        run: .\dist\BARScriptCompiler.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: BARScriptCompiler.exe
          path: dist/BARScriptCompiler.exe
          if-no-files-found: error
